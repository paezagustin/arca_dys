name: arca-dys-dev
services:
  postgres:
    image: postgres:17.8-alpine
    environment:
      POSTGRES_DB: arca_dys_dev
      POSTGRES_USER: arca_dev
      POSTGRES_PASSWORD: local-development-only
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - pg_dev:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U arca_dev -d arca_dys_dev]
      interval: 2s
      timeout: 3s
      retries: 20
    networks: [isolated]
  fastapi:
    build:
      context: .
      target: development
    command: [sh, -c, "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    environment:
      ENV: development
      INTEGRATIONS_MODE: mock
      ALLOW_LIVE_OPERATIONS: "false"
      DATABASE_URL: postgresql://arca_dev:local-development-only@postgres:5432/arca_dys_dev
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s
    networks: [isolated]
  web:
    image: nginx:1.28-alpine
    volumes:
      - ./scripts/dev-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - 127.0.0.1:8001:80
    depends_on:
      fastapi:
        condition: service_healthy
    networks: [edge, isolated]
  adminer:
    image: adminer:5
    profiles: [tools]
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - 127.0.0.1:8082:8080
    depends_on: [postgres]
    networks: [edge, isolated]
volumes:
  pg_dev:
networks:
  isolated:
    internal: true
  edge:

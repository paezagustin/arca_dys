name: arca-dys-prod
services:
  postgres:
    image: postgres:17.8
    container_name: pg_dys
    environment:
      POSTGRES_DB: arca_dys
      POSTGRES_USER: arca_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configurar POSTGRES_PASSWORD}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - ${POSTGRES_DATA_PATH:-/mnt/datos/docker/arca_dys/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U arca_user -d arca_dys]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  fastapi:
    container_name: fastapi_app
    build:
      context: .
      target: production
    env_file: .env.prod
    environment:
      ENV: production
      INTEGRATIONS_MODE: production
      ALLOW_LIVE_OPERATIONS: ${ALLOW_LIVE_OPERATIONS:?Configurar explícitamente ALLOW_LIVE_OPERATIONS}
    volumes:
      - ${ARCA_CERTIFICATES_PATH:-/mnt/datos/docker/arca_dys/certificates}:/run/arca:ro
      - ${APP_LOGS_PATH:-/mnt/datos/docker/arca_dys/logs}:/app/logs
    ports:
      - 127.0.0.1:8001:8000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  ngrok:
    container_name: ngrok
    image: ngrok/ngrok:3
    profiles: [public]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    command: [http, http://fastapi:8000]
    depends_on: [fastapi]
    restart: unless-stopped
  adminer:
    container_name: adminer
    image: adminer:5
    profiles: [tools]
    ports:
      - 127.0.0.1:8081:8080
  backup:
    image: postgres:17.8-alpine
    profiles: [backup]
    environment:
      PGHOST: postgres
      PGDATABASE: arca_dys
      PGUSER: arca_user
      PGPASSWORD: ${POSTGRES_PASSWORD:?Configurar POSTGRES_PASSWORD}
    volumes:
      - ${BACKUP_PATH:-/mnt/datos/docker/arca_dys/backups}:/backups
      - ./scripts/backup-db.sh:/usr/local/bin/backup-db.sh:ro
    entrypoint: [sh, /usr/local/bin/backup-db.sh]
    depends_on:
      postgres:
        condition: service_healthy
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime_kuma
    profiles: [monitoring]
    volumes:
      - ${UPTIME_KUMA_DATA_PATH:-/mnt/datos/docker/uptime-kuma/data}:/app/data
    ports:
      - 127.0.0.1:3001:3001
    restart: unless-stopped

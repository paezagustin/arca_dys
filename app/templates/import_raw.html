<details><summary>Ver celdas originales</summary><dl class="source-cells">{% for coordinate,cell in row.raw.items() %}<dt>{{ coordinate }}</dt><dd>{{ cell.value }}{% if cell.type == 'f' %}<br><button type="button" class="help-trigger" data-help-next aria-label="Ayuda">?</button><template>Valor guardado por Excel: {{ cell.cached if cell.cached is not none else 'No disponible' }}</template>{% endif %}</dd>{% endfor %}</dl></details>

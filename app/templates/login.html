{% extends "base.html" %}{% block title %}Ingresar{% endblock %}{% block content %}
<section class="card narrow"><h1>Bienvenida</h1>
{% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}
<form action="/login" method="post"><input type="hidden" name="login_csrf" value="{{ login_csrf }}">
<div class="field"><label for="username">Usuario</label><input id="username" name="username" autocomplete="username" maxlength="80" required autofocus></div>
<div class="field"><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required></div>
<div class="actions"><button>Ingresar</button></div></form>
{% if request.app.state.integrations_mode == 'mock' %}<button type="button" class="help-trigger" data-help-next aria-label="Ayuda">?</button><template>Solo en las pruebas locales: usuario <strong>admin</strong>, contraseña <strong>pruebas-locales</strong>.</template>{% endif %}</section>{% endblock %}

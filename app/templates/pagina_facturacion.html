<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Facturacion del dia</title>
    <style>
        body { font-family: Arial; margin: 40px; }
        table { border-collapse: collapse; width: 520px; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
        th { background-color: #f0f0f0; }
        .resumen { margin-bottom: 20px; }
        .acciones { display: flex; gap: 10px; margin-top: 20px; }
        button { padding: 10px 20px; font-size: 16px; }
    </style>
</head>
<body>

    <h2>Facturacion del dia</h2>

    <div class="resumen">
        <p><strong>Monto total a facturar:</strong> $ {{ total }}</p>
        <p><strong>Cantidad de pagos:</strong> {{ cantidad }}</p>
    </div>

    <form method="post">
        <table>
            <thead>
                <tr>
                    <th>SELECCIONAR</th>
                    <th>MONTO</th>
                    <th>DIA / HORA</th>
                </tr>
            </thead>
            <tbody>
            {% for pago in pagos %}
                <tr>
                    <td>
                        <input type="checkbox" name="payment_ids" value="{{ pago.id }}">
                    </td>
                    <td>$ {{ pago.mont }}</td>
                    <td>{{ pago.date_approved }} hs</td>
                </tr>
            {% else %}
                <tr>
                    <td colspan="3">No hay pagos hoy</td>
                </tr>
            {% endfor %}
            </tbody>
        </table>

        <div class="acciones">
            <button type="submit" formaction="/ARCA/invoice" formmethod="post">FACTURAR TODO</button>
            <button type="submit" formaction="/ARCA/invoice/selected" formmethod="post">FACTURAR SELECCIONADOS</button>
        </div>
    </form>

</body>
</html>

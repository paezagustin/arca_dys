{% extends "base.html" %}{% block title %}Factura por importe{% endblock %}{% block content %}
<a href="/page/invoice">← Volver a facturación</a><section class="card narrow"><h1>Factura por importe</h1>

<form method="post" action="/ARCA/invoice/manual/preview"><input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
<div class="field"><label for="amount">Importe total a facturar</label><input id="amount" name="amount" type="number" inputmode="numeric" min="{{ minimum }}" max="{{ maximum }}" step="1" required autofocus placeholder="0"></div>
<button type="button" class="help-trigger" data-help-next aria-label="Ayuda">?</button><template>Entre {{ minimum|money }} y {{ maximum|money }}. Comprobante: Factura C.</template>
<div class="actions"><button>Revisar factura</button></div></form></section>{% endblock %}
